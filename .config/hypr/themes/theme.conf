# Optional: The varibles above will be set automatically when the theme is loaded
# This exec commands will soon be deprecated
source =  ./colors.conf
general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = $wallbash_3xa7_rgba $wallbash_3xa9_rgba 45deg
    col.inactive_border = $wallbash_pry3_rgba $wallbash_3xa2_rgba 45deg
    layout = dwindle
    resize_on_border = true
}

group {
    col.border_active = $wallbash_3xa7_rgba $wallbash_3xa9_rgba 45deg
    col.border_inactive = $wallbash_3xa7_rgba $wallbash_3xa9_rgba 45deg
    col.border_locked_active = $wallbash_3xa7_rgba $wallbash_3xa9_rgba 45deg
    col.border_locked_inactive = $wallbash_3xa7_rgba $wallbash_3xa9_rgba 45deg
}

decoration {
    rounding = 23
    shadow:enabled = false

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}

