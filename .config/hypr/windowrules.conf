#
windowrule = opacity 0.90 0.80, match:class ^([Tt]hunar)$
windowrule = opacity 1 override, match:title (.*YouTube.*)
windowrule = opacity 1 override, match:title ^Picture-in-Picture$
windowrule = opacity 1 override, match:title (.*Twitch.*) 
#windowrule = size 40% 70% , match:class ^(org.pulseaudio.pavucontrol)$

windowrule {
    name = float on
    match:class= ^(org.pulseaudio.pavucontrol)$
    float = on
    size = (monitor_w*0.5) (monitor_h*0.5)
}


windowrule {
    name = packettracer
    match:class = ^(PacketTracer)$
    xray = on
    focus_on_activate = on
    nearest_neighbor = on
    float = on
    immediate = on
}

